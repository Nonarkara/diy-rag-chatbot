<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
  <title>Wrong way vs right way — multi-bot vs single orchestrator</title>
  <desc>Two manga panels comparing the failed multi-bot Telegram approach (left, in chaos) with the single-orchestrator pattern that actually works (right, in harmony with an amber accent).</desc>

  <defs>
    <pattern id="hatch-wrong" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1" fill="#111"/>
    </pattern>
    <radialGradient id="right-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9500" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>
    <style>
      .frame       { fill: none; stroke: #111; stroke-width: 1; }
      .frame-hair  { fill: none; stroke: #111; stroke-width: 0.5; }
      .frame-bold  { fill: none; stroke: #111; stroke-width: 3; }
      .frame-amber { fill: none; stroke: #ff9500; stroke-width: 2; }
      .ink         { fill: #111; }
      .paper       { fill: #fafaf7; }
      .manga-line  { fill: none; stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .manga-thin  { fill: none; stroke: #111; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .manga-hair  { fill: none; stroke: #111; stroke-width: 0.5; }
      .text-mono   { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #111; }
      .text-tiny   { font-family: -apple-system, sans-serif; font-size: 9px; fill: #111; letter-spacing: 0.12em; text-transform: uppercase; }
      .text-tiny-amber { font-family: -apple-system, sans-serif; font-size: 9px; fill: #ff9500; letter-spacing: 0.12em; text-transform: uppercase; }
      .text-label  { font-family: -apple-system, sans-serif; font-size: 10px; fill: #111; letter-spacing: 0.05em; text-transform: uppercase; }
      .text-faint  { font-family: -apple-system, sans-serif; font-size: 9px; fill: #555; font-style: italic; }
      .text-title  { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 22px; font-weight: 700; fill: #111; letter-spacing: -0.01em; }
      .text-onoma  { font-family: 'Impact', 'Helvetica Neue', sans-serif; font-size: 32px; font-weight: 900; fill: #111; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#fafaf7"/>
  <rect x="20" y="20" width="1160" height="680" class="frame"/>
  <rect x="28" y="28" width="1144" height="664" class="frame-hair"/>

  <!-- TOP STRIP -->
  <rect x="40" y="40" width="1120" height="48" class="frame-hair"/>
  <text x="56" y="62" class="text-tiny">fig 01 · wrong vs right</text>
  <text x="56" y="80" class="text-title">Multi-bot Telegram vs Single Orchestrator</text>
  <text x="1140" y="80" text-anchor="end" class="text-faint">why N siloed bots ≠ a council</text>

  <!-- ====================== LEFT PANEL — WRONG WAY ====================== -->
  <g transform="translate(40, 110)">
    <!-- Panel border — jagged (chaotic) -->
    <path d="M 0,4 L 540,8 L 555,2 L 540,16 L 555,30 L 535,50 L 555,72
             L 540,98 L 555,125 L 540,150 L 555,178 L 540,205 L 555,232
             L 540,260 L 555,288 L 540,316 L 555,344 L 540,372 L 555,400
             L 540,428 L 555,456 L 540,484 L 555,512 L 540,540 L 555,560
             L 0,564 Z" fill="#fafaf7" class="frame-bold"/>

    <!-- Halftone shading in the background -->
    <rect x="10" y="14" width="530" height="540" fill="url(#hatch-wrong)" opacity="0.25"/>

    <!-- Title stamp -->
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="180" height="32" fill="#111"/>
      <text x="14" y="22" class="text-tiny" fill="#fafaf7">✗ the wrong way</text>
    </g>

    <!-- 4 bot avatars, each with their own speech bubble -->
    <!-- Bot 1 (top-left) -->
    <g transform="translate(80, 100)">
      <rect x="-30" y="-30" width="60" height="50" fill="#fafaf7" class="manga-line"/>
      <rect x="-22" y="-38" width="44" height="14" class="ink"/>
      <rect x="-12" y="-46" width="24" height="8" class="ink"/>
      <text x="0" y="2" text-anchor="middle" class="text-label">bot 1</text>
      <!-- Speech bubble -->
      <path d="M 20,-20 L 140,-20 L 150,0 L 140,20 L 50,20 L 30,30 L 35,15 L 20,10 Z"
            fill="#fafaf7" class="manga-line"/>
      <text x="85" y="-2" text-anchor="middle" class="text-mono">"Answer is X."</text>
      <text x="85" y="14" text-anchor="middle" class="text-faint">no peer review</text>
    </g>
    <!-- Bot 2 (top-right) -->
    <g transform="translate(380, 130)">
      <rect x="-30" y="-30" width="60" height="50" fill="#fafaf7" class="manga-line"/>
      <rect x="-22" y="-38" width="44" height="14" class="ink"/>
      <rect x="-12" y="-46" width="24" height="8" class="ink"/>
      <text x="0" y="2" text-anchor="middle" class="text-label">bot 2</text>
      <path d="M -20,-20 L -140,-20 L -150,-5 L -140,15 L -50,15 L -30,25 L -35,8 L -20,5 Z"
            fill="#fafaf7" class="manga-line"/>
      <text x="-85" y="-2" text-anchor="middle" class="text-mono">"Answer is Y."</text>
      <text x="-85" y="14" text-anchor="middle" class="text-faint">no peer review</text>
    </g>
    <!-- Bot 3 (mid-left) -->
    <g transform="translate(120, 300)">
      <rect x="-30" y="-30" width="60" height="50" fill="#fafaf7" class="manga-line"/>
      <rect x="-22" y="-38" width="44" height="14" class="ink"/>
      <rect x="-12" y="-46" width="24" height="8" class="ink"/>
      <text x="0" y="2" text-anchor="middle" class="text-label">bot 3</text>
      <path d="M 20,-20 L 130,-20 L 140,5 L 130,25 L 50,25 L 30,35 L 35,20 L 20,15 Z"
            fill="#fafaf7" class="manga-line"/>
      <text x="80" y="0" text-anchor="middle" class="text-mono">"Answer is Z."</text>
      <text x="80" y="14" text-anchor="middle" class="text-faint">no peer review</text>
    </g>
    <!-- Bot 4 (mid-right) -->
    <g transform="translate(420, 320)">
      <rect x="-30" y="-30" width="60" height="50" fill="#fafaf7" class="manga-line"/>
      <rect x="-22" y="-38" width="44" height="14" class="ink"/>
      <rect x="-12" y="-46" width="24" height="8" class="ink"/>
      <text x="0" y="2" text-anchor="middle" class="text-label">bot 4</text>
      <path d="M -20,-20 L -130,-20 L -140,5 L -130,25 L -50,25 L -30,35 L -35,20 L -20,15 Z"
            fill="#fafaf7" class="manga-line"/>
      <text x="-80" y="0" text-anchor="middle" class="text-mono">"Answer is W."</text>
      <text x="-80" y="14" text-anchor="middle" class="text-faint">no peer review</text>
    </g>

    <!-- Confusion / chaos marks -->
    <g transform="translate(270, 240)">
      <text class="text-onoma" font-size="48" fill="#111">?!?!</text>
      <text x="0" y="22" text-anchor="middle" class="text-faint" font-size="11">no synthesis</text>
    </g>

    <!-- User at bottom, confused -->
    <g transform="translate(270, 480)">
      <circle cx="0" cy="-30" r="22" fill="#fafaf7" class="manga-line"/>
      <path d="M -22,-50 L -10,-70 L 10,-70 L 22,-50" class="ink"/>
      <!-- Confused eyes (X-shaped manga) -->
      <line x1="-10" y1="-32" x2="-2" y2="-24" class="manga-line"/>
      <line x1="-2"  y1="-32" x2="-10" y2="-24" class="manga-line"/>
      <line x1="2"   y1="-32" x2="10"  y2="-24" class="manga-line"/>
      <line x1="10"  y1="-32" x2="2"   y2="-24" class="manga-line"/>
      <!-- Wavy mouth -->
      <path d="M -8,-15 Q -4,-12 0,-15 Q 4,-12 8,-15" fill="none" class="manga-line"/>
      <!-- Body -->
      <path d="M -30,0 L -35,40 L 35,40 L 30,0 L 20,-10 L -20,-10 Z" fill="#fafaf7" class="manga-line"/>
      <text x="0" y="60" text-anchor="middle" class="text-faint">user</text>
    </g>

    <!-- Sweat drop / vein mark -->
    <path d="M 296,418 Q 292,426 296,434 Q 300,426 296,418 Z" class="ink"/>
    <line x1="296" y1="428" x2="296" y2="432" class="manga-hair" stroke="#fafaf7"/>

    <!-- Onomatopoeia: ガヤガヤ (gaya-gaya, "noisy chatter") -->
    <text x="60" y="500" class="text-onoma" font-size="36" opacity="0.7">ガヤガヤ</text>

    <!-- Bottom caption -->
    <text x="20" y="555" class="text-faint" font-size="10">N bots → N answers → no cross-examination → no verdict</text>
  </g>

  <!-- ====================== RIGHT PANEL — RIGHT WAY ====================== -->
  <g transform="translate(620, 110)">
    <!-- Panel border — clean (MoMA) -->
    <rect x="0" y="0" width="540" height="564" fill="#fafaf7" class="frame"/>
    <rect x="6" y="6" width="528" height="552" class="frame-hair"/>
    <!-- Amber halo behind orchestrator -->
    <circle cx="270" cy="290" r="200" fill="url(#right-glow)"/>

    <!-- Title stamp -->
    <g transform="translate(20, 30)">
      <rect x="0" y="0" width="180" height="32" fill="#ff9500"/>
      <text x="14" y="22" class="text-tiny" fill="#fafaf7">▶ the right way</text>
    </g>

    <!-- Persona "voices" inside the orchestrator (small head silhouettes) -->
    <g transform="translate(270, 290)">
      <!-- Persona ring: 8 small heads around the orchestrator center -->
      <g class="manga-line">
        <circle cx="-90" cy="-50" r="20" fill="#fafaf7"/>
        <text x="-90" y="-46" text-anchor="middle" class="text-tiny">F</text>
        <circle cx="90"  cy="-50" r="20" fill="#fafaf7"/>
        <text x="90" y="-46" text-anchor="middle" class="text-tiny">T</text>
        <circle cx="-110" cy="20" r="20" fill="#fafaf7"/>
        <text x="-110" y="24" text-anchor="middle" class="text-tiny">K</text>
        <circle cx="110"  cy="20" r="20" fill="#fafaf7"/>
        <text x="110" y="24" text-anchor="middle" class="text-tiny">A</text>
        <circle cx="-80"  cy="90" r="20" fill="#fafaf7"/>
        <text x="-80" y="94" text-anchor="middle" class="text-tiny">R</text>
        <circle cx="80"   cy="90" r="20" fill="#fafaf7"/>
        <text x="80" y="94" text-anchor="middle" class="text-tiny">M</text>
        <circle cx="0"   cy="-110" r="20" fill="#fafaf7"/>
        <text x="0" y="-106" text-anchor="middle" class="text-tiny">S</text>
        <circle cx="0"   cy="130" r="20" fill="#fafaf7"/>
        <text x="0" y="134" text-anchor="middle" class="text-tiny">+</text>
      </g>

      <!-- Central orchestrator figure -->
      <circle cx="0" cy="0" r="48" fill="#fafaf7" class="frame-bold"/>
      <circle cx="0" cy="0" r="42" class="frame-amber"/>
      <text x="0" y="-2" text-anchor="middle" class="text-label">ORCHESTRATOR</text>
      <text x="0" y="12" text-anchor="middle" class="text-tiny-amber">1 bot</text>
      <text x="0" y="26" text-anchor="middle" class="text-mono" fill="#ff9500">N personas</text>

      <!-- Lines from personas to the orchestrator -->
      <g class="manga-thin">
        <line x1="-70" y1="-30" x2="-25" y2="-10"/>
        <line x1="70"  y1="-30" x2="25"  y2="-10"/>
        <line x1="-90" y1="20"  x2="-30" y2="5"/>
        <line x1="90"  y1="20"  x2="30"  y2="5"/>
        <line x1="-60" y1="75"  x2="-20" y2="30"/>
        <line x1="60"  y1="75"  x2="20"  y2="30"/>
        <line x1="0"   y1="-90" x2="0"   y2="-30"/>
        <line x1="0"   y1="110" x2="0"   y2="40"/>
      </g>
    </g>

    <!-- Verdict beam (amber, right-pointing) -->
    <g opacity="0.9">
      <path d="M 350,260 L 530,210 L 540,370 L 350,320 Z" fill="#ff9500" opacity="0.25"/>
      <line x1="350" y1="290" x2="540" y2="290" class="frame-amber"/>
      <g fill="#ff9500">
        <polygon points="400,278 412,284 400,290 388,284"/>
        <polygon points="450,272 462,278 450,284 438,278"/>
        <polygon points="500,266 512,272 500,278 488,272"/>
      </g>
    </g>

    <!-- Single verdict document at the right edge -->
    <g transform="translate(490, 290)">
      <rect x="-30" y="-40" width="60" height="80" fill="#fafaf7" class="manga-line"/>
      <rect x="-24" y="-34" width="48" height="68" class="frame-amber"/>
      <line x1="-18" y1="-22" x2="18" y2="-22" class="frame-amber"/>
      <line x1="-18" y1="-12" x2="14" y2="-12" class="manga-hair"/>
      <line x1="-18" y1="-2"  x2="18" y2="-2"  class="manga-hair"/>
      <line x1="-18" y1="8"   x2="10" y2="8"   class="manga-hair"/>
      <line x1="-18" y1="18"  x2="18" y2="18"  class="manga-hair"/>
      <text x="0" y="56" text-anchor="middle" class="text-tiny-amber">verdict</text>
    </g>

    <!-- User at bottom, satisfied -->
    <g transform="translate(280, 480)">
      <circle cx="0" cy="-30" r="22" fill="#fafaf7" class="manga-line"/>
      <path d="M -22,-50 L -10,-70 L 10,-70 L 22,-50" class="ink"/>
      <!-- Happy manga eyes (curved ^ ^) -->
      <path d="M -12,-30 Q -8,-34 -4,-30" class="manga-line" fill="none"/>
      <path d="M 4,-30 Q 8,-34 12,-30" class="manga-line" fill="none"/>
      <!-- Small smile -->
      <path d="M -8,-15 Q 0,-10 8,-15" class="manga-line" fill="none"/>
      <!-- Body -->
      <path d="M -30,0 L -35,40 L 35,40 L 30,0 L 20,-10 L -20,-10 Z" fill="#fafaf7" class="manga-line"/>
      <text x="0" y="60" text-anchor="middle" class="text-faint">user</text>
    </g>

    <!-- Sparkle effects near the orchestrator (manga "success" cue) -->
    <g transform="translate(380, 200)">
      <path d="M 0,-10 L 2,-2 L 10,0 L 2,2 L 0,10 L -2,2 L -10,0 L -2,-2 Z" class="ink"/>
    </g>
    <g transform="translate(180, 410)">
      <path d="M 0,-6 L 1,-1 L 6,0 L 1,1 L 0,6 L -1,1 L -6,0 L -1,-1 Z" class="ink"/>
    </g>

    <!-- Onomatopoeia: キラ (sparkle) -->
    <text x="400" y="170" class="text-onoma" font-size="26" fill="#ff9500">キラ</text>

    <!-- Bottom caption -->
    <text x="20" y="555" class="text-faint" font-size="10">1 bot + N personas as in-process LLM calls → 1 cross-examined verdict</text>
  </g>

  <!-- BOTTOM MoMA STRIP -->
  <rect x="40" y="650" width="1120" height="40" class="frame-hair"/>
  <text x="56" y="670" class="text-tiny-amber">▶ the lesson</text>
  <text x="160" y="670" class="text-mono">channels are mouths. The brain is one process. The deliberation is internal LLM calls.</text>
  <text x="56" y="685" class="text-faint">Why? Telegram bots cannot address each other directly (API constraint) — peer-review only happens inside a single process.</text>
</svg>
