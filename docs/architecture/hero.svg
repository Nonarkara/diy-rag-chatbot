<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
  <title>DIY AI Council — hero illustration</title>
  <desc>The orchestrator at the center, surrounded by 18 persona echoes, an amber verdict beam shooting forward. Manga-passionate linework + MoMA discipline: hairline frame, single amber accent, dense info strip, mono type, bracket terminators.</desc>

  <defs>
    <!-- Halftone pattern for manga shading -->
    <pattern id="halftone-light" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#111"/>
    </pattern>
    <pattern id="halftone-medium" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1" fill="#111"/>
    </pattern>
    <pattern id="halftone-dense" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#111"/>
    </pattern>
    <!-- Speed-line radial pattern: simple, used as decorative backing -->
    <radialGradient id="amber-beam" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#ff9500" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ff9500" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>
    <style>
      .frame       { fill: none; stroke: #111; stroke-width: 1; }
      .frame-hair  { fill: none; stroke: #111; stroke-width: 0.5; }
      .frame-bold  { fill: none; stroke: #111; stroke-width: 3; }
      .frame-amber { fill: none; stroke: #ff9500; stroke-width: 2; }
      .ink         { fill: #111; }
      .amber       { fill: #ff9500; }
      .paper       { fill: #fafaf7; }
      .manga-line  { fill: none; stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .manga-thin  { fill: none; stroke: #111; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .manga-hair  { fill: none; stroke: #111; stroke-width: 0.5; }
      .text-mono   { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #111; }
      .text-tiny   { font-family: -apple-system, sans-serif; font-size: 9px; fill: #111; letter-spacing: 0.12em; text-transform: uppercase; }
      .text-tiny-amber { font-family: -apple-system, sans-serif; font-size: 9px; fill: #ff9500; letter-spacing: 0.12em; text-transform: uppercase; }
      .text-label  { font-family: -apple-system, sans-serif; font-size: 10px; fill: #111; letter-spacing: 0.05em; text-transform: uppercase; }
      .text-faint  { font-family: -apple-system, sans-serif; font-size: 9px; fill: #555; font-style: italic; }
      .text-title  { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 22px; font-weight: 700; fill: #111; letter-spacing: -0.01em; }
      .text-h1     { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 16px; font-weight: 600; fill: #111; }
      .text-onoma  { font-family: 'Impact', 'Helvetica Neue', sans-serif; font-size: 36px; font-weight: 900; fill: #111; letter-spacing: 0.02em; }
      .text-bracket{ font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 12px; fill: #111; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="760" fill="#fafaf7"/>

  <!-- OUTER FRAME -->
  <rect x="20" y="20" width="1160" height="720" class="frame"/>
  <rect x="28" y="28" width="1144" height="704" class="frame-hair"/>

  <!-- TOP MoMA STRIP — title bar -->
  <rect x="40" y="40" width="1120" height="48" class="frame-hair"/>
  <text x="56" y="62" class="text-tiny">fig 00 · hero</text>
  <text x="56" y="80" class="text-title">DIY AI Council · single-orchestrator pattern</text>
  <text x="1140" y="62" text-anchor="end" class="text-tiny">v 1.2.0 · MIT · nonarkara.org</text>
  <text x="1140" y="80" text-anchor="end" class="text-faint">commit 90ed07e → ec9cadb</text>

  <!-- SPEED LINES — radiating from the central figure, manga-style -->
  <g opacity="0.85">
    <!-- top -->
    <line x1="600" y1="120" x2="600" y2="160" class="manga-line"/>
    <line x1="540" y1="125" x2="555" y2="165" class="manga-line"/>
    <line x1="660" y1="125" x2="645" y2="165" class="manga-line"/>
    <line x1="480" y1="135" x2="510" y2="170" class="manga-line"/>
    <line x1="720" y1="135" x2="690" y2="170" class="manga-line"/>
    <line x1="420" y1="155" x2="460" y2="180" class="manga-thin"/>
    <line x1="780" y1="155" x2="740" y2="180" class="manga-thin"/>
    <!-- left -->
    <line x1="180" y1="380" x2="240" y2="380" class="manga-line"/>
    <line x1="180" y1="330" x2="245" y2="345" class="manga-line"/>
    <line x1="180" y1="430" x2="245" y2="415" class="manga-line"/>
    <line x1="200" y1="280" x2="260" y2="310" class="manga-thin"/>
    <line x1="200" y1="480" x2="260" y2="450" class="manga-thin"/>
    <!-- right -->
    <line x1="1020" y1="380" x2="960" y2="380" class="manga-line"/>
    <line x1="1020" y1="330" x2="955" y2="345" class="manga-line"/>
    <line x1="1020" y1="430" x2="955" y2="415" class="manga-line"/>
    <line x1="1000" y1="280" x2="940" y2="310" class="manga-thin"/>
    <line x1="1000" y1="480" x2="940" y2="450" class="manga-thin"/>
  </g>

  <!-- HALFTONE BACKGROUND for the central zone -->
  <ellipse cx="600" cy="400" rx="340" ry="240" fill="url(#halftone-light)" opacity="0.4"/>

  <!-- THE ORCHESTRATOR (manga-passionate figure at center) -->
  <g transform="translate(600, 380)">
    <!-- Body / robe — manga flowing shape -->
    <path d="M -90,140 L -110,40 L -70,-20 L -50,-90 L 50,-90 L 70,-20 L 110,40 L 90,140 Z"
          fill="#fafaf7" class="manga-line"/>
    <!-- Cross-hatching on the robe (manga shading) -->
    <g class="manga-hair" opacity="0.7">
      <line x1="-80" y1="20"  x2="-60" y2="0"/>
      <line x1="-90" y1="40"  x2="-70" y2="20"/>
      <line x1="-95" y1="60"  x2="-75" y2="40"/>
      <line x1="-100" y1="80" x2="-80" y2="60"/>
      <line x1="80"  y1="20"  x2="60"  y2="0"/>
      <line x1="90"  y1="40"  x2="70"  y2="20"/>
      <line x1="95"  y1="60"  x2="75"  y2="40"/>
      <line x1="100" y1="80"  x2="80"  y2="60"/>
    </g>
    <!-- Belt -->
    <rect x="-55" y="20" width="110" height="14" class="ink"/>
    <rect x="-55" y="20" width="110" height="14" fill="none" class="manga-line"/>
    <!-- Arms — extended forward in a passionate pose -->
    <path d="M -50,30 L -130,90 L -140,80 L -60,10 Z" fill="#fafaf7" class="manga-line"/>
    <path d="M 50,30 L 130,90 L 140,80 L 60,10 Z" fill="#fafaf7" class="manga-line"/>
    <!-- Fists (clenched, determined) -->
    <circle cx="-138" cy="85" r="14" fill="#fafaf7" class="manga-line"/>
    <circle cx="138"  cy="85" r="14" fill="#fafaf7" class="manga-line"/>
    <!-- Cross-hatching on fists (knuckle shadows) -->
    <path d="M -148,82 L -132,76 M -150,90 L -130,84 M -148,98 L -132,92"
          class="manga-hair" opacity="0.7"/>
    <path d="M 148,82 L 132,76 M 150,90 L 130,84 M 148,98 L 132,92"
          class="manga-hair" opacity="0.7"/>
    <!-- Neck -->
    <rect x="-15" y="-95" width="30" height="15" class="ink"/>
    <!-- Head (manga, slightly tilted forward — determined) -->
    <ellipse cx="0" cy="-130" rx="50" ry="58" fill="#fafaf7" class="manga-line"/>
    <!-- Hair — manga spiky -->
    <path d="M -55,-150 L -45,-180 L -25,-160 L -10,-195 L 10,-160 L 30,-185 L 45,-160 L 60,-150
             L 50,-130 L -50,-130 Z" class="ink"/>
    <!-- Manga spike details -->
    <line x1="-30" y1="-175" x2="-20" y2="-185" class="manga-hair"/>
    <line x1="0" y1="-185" x2="5" y2="-195" class="manga-hair"/>
    <line x1="20" y1="-175" x2="30" y2="-185" class="manga-hair"/>
    <!-- EYES — manga style: large, intense, with shine -->
    <!-- Left eye -->
    <ellipse cx="-18" cy="-138" rx="14" ry="16" fill="#fafaf7" class="manga-line"/>
    <ellipse cx="-18" cy="-138" rx="10" ry="13" class="ink"/>
    <circle cx="-15" cy="-142" r="3" fill="#fafaf7"/>
    <circle cx="-22" cy="-134" r="1.5" fill="#fafaf7"/>
    <!-- Right eye — slightly squinting (determined) -->
    <path d="M 4,-148 L 28,-150 L 30,-130 L 4,-128 Z" class="ink"/>
    <path d="M 4,-148 L 28,-150" class="manga-thin" stroke="#fafaf7" stroke-width="1"/>
    <!-- Eyebrows — angled, fierce -->
    <line x1="-32" y1="-158" x2="-4" y2="-156" class="manga-line"/>
    <line x1="6" y1="-156" x2="32" y2="-160" class="manga-line"/>
    <!-- Mouth — clenched, determined -->
    <path d="M -10,-110 L 10,-110 L 8,-104 L -8,-104 Z" class="ink"/>
    <!-- Sweat drop — manga passion cue -->
    <path d="M -56,-138 Q -60,-130 -56,-122 Q -52,-130 -56,-138 Z" class="ink"/>
    <line x1="-56" y1="-128" x2="-56" y2="-122" class="manga-hair" stroke="#fafaf7"/>
    <!-- Vein mark on temple (manga "intensity" cue) -->
    <path d="M -48,-160 L -42,-154 L -48,-148 L -54,-154 Z" class="ink"/>
    <line x1="-48" y1="-156" x2="-48" y2="-152" class="manga-hair" stroke="#fafaf7"/>
  </g>

  <!-- THE AMBER VERDICT BEAM — emanates from the orchestrator's mouth forward -->
  <g opacity="0.9">
    <!-- Beam shape: trapezoid -->
    <path d="M 612,300 L 880,180 L 920,520 L 612,460 Z" fill="url(#amber-beam)"/>
    <!-- Inner brighter line -->
    <line x1="612" y1="380" x2="920" y2="350" class="frame-amber" stroke="#ff9500"/>
    <!-- Pulse marks along the beam -->
    <g fill="#ff9500">
      <polygon points="700,310 712,316 700,322 688,316"/>
      <polygon points="780,290 792,296 780,302 768,296"/>
      <polygon points="850,275 862,281 850,287 838,281"/>
    </g>
  </g>

  <!-- ONOMATOPOEIA — manga "deciding" sound, behind the orchestrator's head -->
  <g transform="translate(420, 200)" opacity="0.92">
    <text class="text-onoma">決断</text>
    <text x="0" y="36" class="text-onoma" font-size="20" font-weight="800">KETSUDAN!</text>
  </g>

  <!-- ONOMATOPOEIA on the verdict beam side -->
  <g transform="translate(750, 540)" opacity="0.92">
    <text class="text-onoma" font-size="28">キラ</text>
    <text x="0" y="22" class="text-faint" font-size="10">— verdict crystallises —</text>
  </g>

  <!-- PERSONA ECHOES — 6 silhouettes around the orchestrator (selected from 18) -->
  <g opacity="0.85">
    <!-- Top-left: Torvalds (hard-hat silhouette) -->
    <g transform="translate(180, 220)">
      <rect x="-30" y="-10" width="60" height="60" fill="#fafaf7" class="manga-line"/>
      <path d="M -22,-10 L -22,-30 L -8,-40 L 8,-40 L 22,-30 L 22,-10 Z" class="ink"/>
      <circle cx="0" cy="-15" r="12" fill="#fafaf7" class="manga-line"/>
      <line x1="-10" y1="-15" x2="10" y2="-15" class="manga-thin"/>
      <text x="0" y="70" text-anchor="middle" class="text-label">torvalds</text>
      <text x="0" y="84" text-anchor="middle" class="text-faint">ship-or-shut-up</text>
    </g>
    <!-- Top-right: Feynman (chalk + chalkboard) -->
    <g transform="translate(1020, 220)">
      <rect x="-30" y="-10" width="60" height="60" fill="#fafaf7" class="manga-line"/>
      <rect x="-20" y="-20" width="40" height="25" fill="#111"/>
      <line x1="-15" y1="-12" x2="15" y2="-12" stroke="#fafaf7" stroke-width="1"/>
      <line x1="-15" y1="-5" x2="10" y2="-5" stroke="#fafaf7" stroke-width="1"/>
      <text x="0" y="70" text-anchor="middle" class="text-label">feynman</text>
      <text x="0" y="84" text-anchor="middle" class="text-faint">first principles</text>
    </g>
    <!-- Mid-left: Karpathy (neural net diagram) -->
    <g transform="translate(160, 410)">
      <rect x="-30" y="-15" width="60" height="60" fill="#fafaf7" class="manga-line"/>
      <circle cx="-12" cy="5" r="4" class="ink"/>
      <circle cx="12"  cy="5" r="4" class="ink"/>
      <circle cx="0"   cy="-10" r="4" class="ink"/>
      <line x1="-12" y1="5" x2="0" y2="-10" class="manga-thin"/>
      <line x1="12"  y1="5" x2="0" y2="-10" class="manga-thin"/>
      <line x1="-12" y1="5" x2="12" y2="5"  class="manga-thin"/>
      <text x="0" y="65" text-anchor="middle" class="text-label">karpathy</text>
      <text x="0" y="79" text-anchor="middle" class="text-faint">empirical ML</text>
    </g>
    <!-- Mid-right: Aurelius (stoic profile, laurel) -->
    <g transform="translate(1040, 410)">
      <rect x="-30" y="-15" width="60" height="60" fill="#fafaf7" class="manga-line"/>
      <circle cx="0" cy="5" r="14" fill="#fafaf7" class="manga-line"/>
      <path d="M -4,8 L -2,12 L 2,12 L 4,8" class="ink"/>
      <circle cx="-5" cy="2" r="1.5" class="ink"/>
      <circle cx="5"  cy="2" r="1.5" class="ink"/>
      <path d="M -14,-5 L -18,-12 L -16,-15 L -12,-8" class="ink"/>
      <path d="M 14,-5 L 18,-12 L 16,-15 L 12,-8" class="ink"/>
      <text x="0" y="65" text-anchor="middle" class="text-label">aurelius</text>
      <text x="0" y="79" text-anchor="middle" class="text-faint">moral clarity</text>
    </g>
    <!-- Bottom-left: Rams (a single, perfectly-ruled rectangle) -->
    <g transform="translate(220, 600)">
      <rect x="-30" y="-10" width="60" height="60" fill="#fafaf7" class="manga-line"/>
      <rect x="-18" y="5" width="36" height="22" fill="#fafaf7" class="manga-line"/>
      <line x1="-12" y1="13" x2="12" y2="13" class="manga-thin"/>
      <line x1="-12" y1="20" x2="12" y2="20" class="manga-thin"/>
      <text x="0" y="70" text-anchor="middle" class="text-label">rams</text>
      <text x="0" y="84" text-anchor="middle" class="text-faint">less, but better</text>
    </g>
    <!-- Bottom-right: Curator (folder + magnifier) -->
    <g transform="translate(980, 600)">
      <rect x="-30" y="-10" width="60" height="60" fill="#fafaf7" class="manga-line"/>
      <path d="M -16,-5 L -8,-5 L -4,-10 L 16,-10 L 16,15 L -16,15 Z" fill="#fafaf7" class="manga-line"/>
      <circle cx="14" cy="20" r="6" fill="#fafaf7" class="manga-thin"/>
      <line x1="18" y1="24" x2="24" y2="30" class="manga-thin"/>
      <text x="0" y="70" text-anchor="middle" class="text-label">rag-curator</text>
      <text x="0" y="84" text-anchor="middle" class="text-faint">folder-grounded</text>
    </g>
  </g>

  <!-- "13 more personas" annotation -->
  <g transform="translate(600, 700)" text-anchor="middle">
    <text class="text-tiny">… 13 more · ada · aristotle · socrates · sun tzu · machiavelli · lao tzu · meckers · munger · musashi · watts · sutskeer · taleb · meadows</text>
  </g>

  <!-- VERDICT DOCUMENT (small, in the beam path) -->
  <g transform="translate(960, 380)">
    <rect x="-40" y="-50" width="80" height="100" fill="#fafaf7" class="manga-line"/>
    <rect x="-34" y="-44" width="68" height="88" class="frame-hair"/>
    <text x="0" y="-30" text-anchor="middle" class="text-tiny-amber">▼ verdict</text>
    <line x1="-28" y1="-22" x2="28" y2="-22" class="frame-amber"/>
    <line x1="-28" y1="-12" x2="28" y2="-12" class="manga-hair"/>
    <line x1="-28" y1="-4"  x2="20" y2="-4"  class="manga-hair"/>
    <line x1="-28" y1="4"   x2="28" y2="4"   class="manga-hair"/>
    <line x1="-28" y1="12"  x2="14" y2="12"  class="manga-hair"/>
    <line x1="-28" y1="20"  x2="28" y2="20"  class="frame-amber"/>
    <text x="0" y="38" text-anchor="middle" class="text-faint">1 of N</text>
  </g>

  <!-- BOTTOM MoMA STRIP — operating metrics -->
  <rect x="40" y="660" width="1120" height="60" class="frame-hair"/>
  <line x1="40" y1="680" x2="1160" y2="680" class="manga-hair"/>

  <text x="56" y="675" class="text-tiny-amber">▶ operating</text>

  <g transform="translate(56, 705)">
    <text class="text-mono">PROFILE     </text>
    <text x="80" class="text-mono" fill="#ff9500">execution-lean</text>
  </g>
  <g transform="translate(230, 705)">
    <text class="text-mono">TRIAD       </text>
    <text x="80" class="text-mono" fill="#ff9500">ship-now</text>
  </g>
  <g transform="translate(370, 705)">
    <text class="text-mono">PERSONAS    </text>
    <text x="80" class="text-mono" fill="#ff9500">19</text>
  </g>
  <g transform="translate(460, 705)">
    <text class="text-mono">STAGES      </text>
    <text x="80" class="text-mono" fill="#ff9500">5</text>
  </g>
  <g transform="translate(540, 705)">
    <text class="text-mono">CHANNEL     </text>
    <text x="80" class="text-mono" fill="#ff9500">telegram</text>
  </g>
  <g transform="translate(660, 705)">
    <text class="text-mono">LLM         </text>
    <text x="80" class="text-mono" fill="#ff9500">ollama:qwen3:4b</text>
  </g>
  <g transform="translate(840, 705)">
    <text class="text-mono">LATENCY     </text>
    <text x="80" class="text-mono" fill="#ff9500">~2–4 min</text>
  </g>

  <text x="1140" y="705" text-anchor="end" class="text-faint">[ single-orchestrator pattern ]</text>

  <!-- Corner bracket terminators (MoMA detail) -->
  <g class="frame-hair" stroke-width="1">
    <path d="M 28,60 L 28,28 L 60,28"/>
    <path d="M 1140,28 L 1172,28 L 1172,60"/>
    <path d="M 28,700 L 28,732 L 60,732"/>
    <path d="M 1140,732 L 1172,732 L 1172,700"/>
  </g>

</svg>
