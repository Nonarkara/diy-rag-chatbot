<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, BlinkMacSystemFont, 'SF Mono', 'JetBrains Mono', Menlo, monospace">
  <title>Why this wins — comparison across the four common approaches</title>
  <desc>Four manga panels comparing approaches: single-LLM, multi-bot, RAG-only, and the DIY orchestrator. The orchestrator wins on breadth × grounding × synthesis.</desc>

  <defs>
    <radialGradient id="halo-amber" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ff9500" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch-loss" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M 0,4 L 4,0" stroke="#111" stroke-width="0.4"/>
    </pattern>
    <style>
      .frame       { fill: none; stroke: #111; stroke-width: 1; }
      .frame-hair  { fill: none; stroke: #111; stroke-width: 0.5; }
      .frame-bold  { fill: none; stroke: #111; stroke-width: 3; }
      .frame-amber { fill: none; stroke: #ff9500; stroke-width: 2; }
      .ink         { fill: #111; }
      .paper       { fill: #fafaf7; }
      .manga-line  { fill: none; stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .manga-thin  { fill: none; stroke: #111; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .manga-hair  { fill: none; stroke: #111; stroke-width: 0.5; }
      .text-mono   { font-family: 'SF Mono', 'JetBrains Mono', Menlo, monospace; font-size: 10px; fill: #111; }
      .text-tiny   { font-family: -apple-system, sans-serif; font-size: 9px; fill: #111; letter-spacing: 0.12em; text-transform: uppercase; }
      .text-tiny-amber { font-family: -apple-system, sans-serif; font-size: 9px; fill: #ff9500; letter-spacing: 0.12em; text-transform: uppercase; }
      .text-label  { font-family: -apple-system, sans-serif; font-size: 10px; fill: #111; letter-spacing: 0.05em; text-transform: uppercase; }
      .text-faint  { font-family: -apple-system, sans-serif; font-size: 9px; fill: #555; font-style: italic; }
      .text-title  { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 22px; font-weight: 700; fill: #111; letter-spacing: -0.01em; }
      .text-onoma  { font-family: 'Impact', 'Helvetica Neue', sans-serif; font-size: 22px; font-weight: 900; fill: #111; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#fafaf7"/>
  <rect x="20" y="20" width="1160" height="760" class="frame"/>
  <rect x="28" y="28" width="1144" height="744" class="frame-hair"/>

  <!-- TOP STRIP -->
  <rect x="40" y="40" width="1120" height="48" class="frame-hair"/>
  <text x="56" y="62" class="text-tiny">fig 03 · why this wins</text>
  <text x="56" y="80" class="text-title">Four approaches · one orchestrator wins</text>
  <text x="1140" y="80" text-anchor="end" class="text-faint">breadth × grounding × synthesis × cost</text>

  <!-- COLUMN HEADERS (axes) -->
  <g transform="translate(56, 110)">
    <rect x="0" y="0" width="1080" height="28" class="frame-hair"/>
    <text x="14"  y="20" class="text-tiny-amber">approach</text>
    <text x="220" y="20" class="text-tiny-amber">breadth</text>
    <text x="370" y="20" class="text-tiny-amber">grounding</text>
    <text x="520" y="20" class="text-tiny-amber">synthesis</text>
    <text x="680" y="20" class="text-tiny-amber">cost</text>
    <text x="800" y="20" class="text-tiny-amber">deploys?</text>
    <text x="920" y="20" class="text-tiny-amber">verdict</text>
  </g>

  <!-- ============ ROW 1: SINGLE-LLM ============ -->
  <g transform="translate(56, 148)">
    <rect x="0" y="0" width="1080" height="120" fill="#fafaf7" class="frame"/>
    <!-- Approach label -->
    <text x="14" y="22" class="text-label">A · single LLM</text>
    <text x="14" y="40" class="text-faint">"just ask GPT-5"</text>

    <!-- Manga: one bored/aloof figure -->
    <g transform="translate(80, 75)">
      <circle cx="0" cy="0" r="20" fill="#fafaf7" class="manga-line"/>
      <path d="M -20,-10 L -10,-28 L 10,-28 L 20,-10" class="ink"/>
      <!-- Aloof / half-closed eyes -->
      <path d="M -12,-2 Q -8,0 -4,-2" class="manga-line" fill="none"/>
      <path d="M 4,-2 Q 8,0 12,-2" class="manga-line" fill="none"/>
      <!-- Small smirk -->
      <path d="M -4,8 Q 0,12 4,8" class="manga-line" fill="none"/>
    </g>

    <!-- Bars (small / low scores) -->
    <g transform="translate(220, 50)">
      <rect x="0" y="0" width="60" height="14" class="ink"/>
      <rect x="60" y="0" width="80" height="14" fill="url(#hatch-loss)"/>
      <text x="0" y="32" class="text-faint">1 perspective</text>
    </g>
    <g transform="translate(370, 50)">
      <rect x="0" y="0" width="40" height="14" class="ink"/>
      <rect x="40" y="0" width="100" height="14" fill="url(#hatch-loss)"/>
      <text x="0" y="32" class="text-faint">no evidence check</text>
    </g>
    <g transform="translate(520, 50)">
      <rect x="0" y="0" width="60" height="14" class="ink"/>
      <rect x="60" y="0" width="80" height="14" fill="url(#hatch-loss)"/>
      <text x="0" y="32" class="text-faint">just the prose</text>
    </g>
    <g transform="translate(680, 50)">
      <rect x="0" y="0" width="140" height="14" class="ink"/>
      <text x="0" y="32" class="text-faint">$ per call (provider API)</text>
    </g>
    <g transform="translate(800, 50)">
      <text class="text-mono">yes · via API</text>
      <text y="14" class="text-faint">but no Telegram</text>
    </g>
    <g transform="translate(920, 50)">
      <text class="text-mono">"the AI said X."</text>
      <text y="14" class="text-faint">no dissent, no reasons</text>
    </g>
  </g>

  <!-- ============ ROW 2: MULTI-BOT TELEGRAM (THE FAILURE MODE) ============ -->
  <g transform="translate(56, 278)">
    <rect x="0" y="0" width="1080" height="120" fill="#fafaf7" class="frame"/>
    <!-- X mark stamp -->
    <g transform="translate(14, 12)">
      <rect x="0" y="0" width="22" height="22" fill="#111"/>
      <text x="11" y="18" text-anchor="middle" class="text-tiny" fill="#fafaf7">✗</text>
    </g>
    <text x="48" y="26" class="text-label">B · multi-bot Telegram</text>
    <text x="48" y="42" class="text-faint">"one bot per persona, on Telegram"</text>

    <!-- Manga: 4 small bots in chaos, with overlap speech bubbles -->
    <g transform="translate(50, 80)">
      <rect x="-12" y="-12" width="24" height="20" fill="#fafaf7" class="manga-line"/>
      <rect x="-8" y="-16" width="16" height="6" class="ink"/>
      <rect x="-4" y="-20" width="8" height="4" class="ink"/>
    </g>
    <g transform="translate(80, 75)">
      <rect x="-12" y="-12" width="24" height="20" fill="#fafaf7" class="manga-line"/>
      <rect x="-8" y="-16" width="16" height="6" class="ink"/>
      <rect x="-4" y="-20" width="8" height="4" class="ink"/>
    </g>
    <g transform="translate(110, 85)">
      <rect x="-12" y="-12" width="24" height="20" fill="#fafaf7" class="manga-line"/>
      <rect x="-8" y="-16" width="16" height="6" class="ink"/>
      <rect x="-4" y="-20" width="8" height="4" class="ink"/>
    </g>
    <g transform="translate(140, 80)">
      <rect x="-12" y="-12" width="24" height="20" fill="#fafaf7" class="manga-line"/>
      <rect x="-8" y="-16" width="16" height="6" class="ink"/>
      <rect x="-4" y="-20" width="8" height="4" class="ink"/>
    </g>
    <text x="160" y="80" class="text-onoma" font-size="18" opacity="0.5">?!?!</text>

    <!-- Bars -->
    <g transform="translate(220, 50)">
      <rect x="0" y="0" width="120" height="14" class="ink"/>
      <rect x="120" y="0" width="20" height="14" fill="url(#hatch-loss)"/>
      <text x="0" y="32" class="text-faint">N bots in parallel</text>
    </g>
    <g transform="translate(370, 50)">
      <rect x="0" y="0" width="20" height="14" class="ink"/>
      <rect x="20" y="0" width="120" height="14" fill="url(#hatch-loss)"/>
      <text x="0" y="32" class="text-faint">none — bots don't see each other</text>
    </g>
    <g transform="translate(520, 50)">
      <rect x="0" y="0" width="0" height="14" fill="none"/>
      <rect x="0" y="0" width="140" height="14" fill="url(#hatch-loss)"/>
      <text x="0" y="32" class="text-faint">zero — no shared verdict</text>
    </g>
    <g transform="translate(680, 50)">
      <rect x="0" y="0" width="140" height="14" class="ink"/>
      <text x="0" y="32" class="text-faint">N × per-call cost</text>
    </g>
    <g transform="translate(800, 50)">
      <text class="text-mono">yes · Telegram</text>
      <text y="14" class="text-faint">but no synthesis</text>
    </g>
    <g transform="translate(920, 50)">
      <text class="text-mono">"4 bots said 4 things."</text>
      <text y="14" class="text-faint">the user picks arbitrarily</text>
    </g>
  </g>

  <!-- ============ ROW 3: RAG-ONLY ============ -->
  <g transform="translate(56, 408)">
    <rect x="0" y="0" width="1080" height="120" fill="#fafaf7" class="frame"/>
    <text x="14" y="22" class="text-label">C · RAG alone</text>
    <text x="14" y="40" class="text-faint">"smart retrieval, single LLM"</text>

    <!-- Manga: a knowledge folder with a single speaker -->
    <g transform="translate(80, 75)">
      <path d="M -16,-5 L -8,-5 L -4,-10 L 16,-10 L 16,15 L -16,15 Z" fill="#fafaf7" class="manga-line"/>
      <line x1="-10" y1="-2" x2="10" y2="-2" class="manga-thin"/>
      <line x1="-10" y1="4" x2="10" y2="4" class="manga-thin"/>
      <line x1="-10" y1="10" x2="6" y2="10" class="manga-thin"/>
    </g>
    <g transform="translate(140, 75)">
      <circle cx="0" cy="0" r="18" fill="#fafaf7" class="manga-line"/>
      <path d="M -18,-10 L -8,-25 L 8,-25 L 18,-10" class="ink"/>
      <path d="M -10,-2 Q -6,-6 -2,-2" class="manga-line" fill="none"/>
      <path d="M 2,-2 Q 6,-6 10,-2" class="manga-line" fill="none"/>
    </g>
    <line x1="100" y1="75" x2="120" y2="75" class="manga-thin"/>
    <path d="M 118,71 L 124,75 L 118,79 Z" class="ink"/>

    <g transform="translate(220, 50)">
      <rect x="0" y="0" width="40" height="14" class="ink"/>
      <rect x="40" y="0" width="100" height="14" fill="url(#hatch-loss)"/>
      <text x="0" y="32" class="text-faint">1 perspective on a corpus</text>
    </g>
    <g transform="translate(370, 50)">
      <rect x="0" y="0" width="120" height="14" class="ink"/>
      <rect x="120" y="0" width="20" height="14" fill="url(#hatch-loss)"/>
      <text x="0" y="32" class="text-faint">folder-grounded</text>
    </g>
    <g transform="translate(520, 50)">
      <rect x="0" y="0" width="60" height="14" class="ink"/>
      <rect x="60" y="0" width="80" height="14" fill="url(#hatch-loss)"/>
      <text x="0" y="32" class="text-faint">still one answer</text>
    </g>
    <g transform="translate(680, 50)">
      <rect x="0" y="0" width="100" height="14" class="ink"/>
      <text x="0" y="32" class="text-faint">1× per-call + retrieval</text>
    </g>
    <g transform="translate(800, 50)">
      <text class="text-mono">yes · via webhook</text>
      <text y="14" class="text-faint">LINE / Telegram / web</text>
    </g>
    <g transform="translate(920, 50)">
      <text class="text-mono">"the file says X."</text>
      <text y="14" class="text-faint">no cross-examination</text>
    </g>
  </g>

  <!-- ============ ROW 4: DIY ORCHESTRATOR (THE WINNER) ============ -->
  <g transform="translate(56, 538)">
    <rect x="0" y="0" width="1080" height="120" fill="url(#halo-amber)"/>
    <rect x="0" y="0" width="1080" height="120" class="frame-amber"/>

    <!-- Trophy stamp -->
    <g transform="translate(14, 12)">
      <rect x="0" y="0" width="34" height="22" fill="#ff9500"/>
      <text x="17" y="17" text-anchor="middle" class="text-tiny" fill="#fafaf7">★ wins</text>
    </g>
    <text x="56" y="26" class="text-label-amber" fill="#ff9500" font-weight="700">D · DIY orchestrator (this repo)</text>
    <text x="56" y="42" class="text-faint">"one bot, N personas as in-process LLM calls, 5 stages"</text>

    <!-- Manga: orchestrator with 5 persona echoes around it -->
    <g transform="translate(80, 75)">
      <!-- Echoes (small circles around) -->
      <circle cx="-30" cy="-12" r="8" fill="#fafaf7" class="manga-line"/>
      <text x="-30" y="-9" text-anchor="middle" class="text-tiny" font-size="7">F</text>
      <circle cx="30" cy="-12" r="8" fill="#fafaf7" class="manga-line"/>
      <text x="30" y="-9" text-anchor="middle" class="text-tiny" font-size="7">T</text>
      <circle cx="-36" cy="14" r="8" fill="#fafaf7" class="manga-line"/>
      <text x="-36" y="17" text-anchor="middle" class="text-tiny" font-size="7">K</text>
      <circle cx="36" cy="14" r="8" fill="#fafaf7" class="manga-line"/>
      <text x="36" y="17" text-anchor="middle" class="text-tiny" font-size="7">A</text>
      <circle cx="0" cy="-26" r="8" fill="#fafaf7" class="manga-line"/>
      <text x="0" y="-23" text-anchor="middle" class="text-tiny" font-size="7">R</text>
      <circle cx="0" cy="30" r="8" fill="#fafaf7" class="manga-line"/>
      <text x="0" y="33" text-anchor="middle" class="text-tiny" font-size="7">+</text>
      <!-- Center orchestrator -->
      <circle cx="0" cy="0" r="16" fill="#fafaf7" class="frame-amber"/>
      <text x="0" y="3" text-anchor="middle" class="text-tiny-amber">ORC</text>
    </g>

    <!-- Full bars (winner takes all) -->
    <g transform="translate(220, 50)">
      <rect x="0" y="0" width="140" height="14" class="frame-amber" fill="none"/>
      <rect x="0" y="0" width="140" height="14" fill="#ff9500" opacity="0.4"/>
      <text x="0" y="32" class="text-faint">N personas · parallel</text>
    </g>
    <g transform="translate(370, 50)">
      <rect x="0" y="0" width="140" height="14" fill="#ff9500" opacity="0.4"/>
      <rect x="0" y="0" width="140" height="14" class="frame-amber" fill="none"/>
      <text x="0" y="32" class="text-faint">folder + cross-examined</text>
    </g>
    <g transform="translate(520, 50)">
      <rect x="0" y="0" width="140" height="14" fill="#ff9500" opacity="0.4"/>
      <rect x="0" y="0" width="140" height="14" class="frame-amber" fill="none"/>
      <text x="0" y="32" class="text-faint">chairman synthesis</text>
    </g>
    <g transform="translate(680, 50)">
      <rect x="0" y="0" width="140" height="14" fill="#ff9500" opacity="0.4"/>
      <rect x="0" y="0" width="140" height="14" class="frame-amber" fill="none"/>
      <text x="0" y="32" class="text-faint">$ same as 1 LLM · Ollama free</text>
    </g>
    <g transform="translate(800, 50)">
      <text class="text-mono" fill="#ff9500" font-weight="700">yes · all channels</text>
      <text y="14" class="text-faint">Telegram (shipped) · Discord · web</text>
    </g>
    <g transform="translate(920, 50)">
      <text class="text-mono" fill="#ff9500" font-weight="700">structured verdict</text>
      <text y="14" class="text-faint">+ dissent + kill criteria + next</text>
    </g>
  </g>

  <!-- ============ BOTTOM: THE WINNING AXIS EXPLAINED ============ -->
  <rect x="40" y="680" width="1120" height="80" class="frame-hair"/>
  <text x="56" y="704" class="text-tiny-amber">▶ why D wins</text>
  <text x="170" y="704" class="text-mono">breadth (N personas) × grounding (open the file) × synthesis (chairman) — same cost as a single call.</text>
  <text x="56" y="724" class="text-mono">A is cheap to build, narrow. B is wide, no synthesis. C is grounded, no dissent. D is all four — because the deliberation lives inside one process.</text>
  <text x="56" y="744" class="text-faint">Replicated: bin/council (host CLI) · bin/llm-council (karpathy) · python -m bot (Telegram) — all call the same orchestrator pattern.</text>
</svg>
