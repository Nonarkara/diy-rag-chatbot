# Workshop v2 defaults. Environment variables override this file.
# Secrets do not belong here — put tokens in .env (see .env.example).

# lite: one agent at a time (cheap API, sequential calls).
# full: up to 4 agents in flight (still an API; more concurrent requests).
mode: lite

# openai  — any OpenAI-compatible API (OpenAI, OpenRouter, Groq, LM Studio)
# ollama  — optional local weights
# scripted — offline tool rehearsal (python -m workshop demo --offline)
provider: openai

# Cheap default. OpenRouter example: openai/gpt-4o-mini with LLM_BASE_URL set.
model: gpt-4o-mini

knowledge_dir: knowledge

# Hard stop so a confused model cannot chat all afternoon.
max_turns: 8
max_revisions: 1
